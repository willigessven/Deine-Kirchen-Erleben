# Einstellungen für Netlify. Netlify liest diese Datei automatisch.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Sicherheits- und Datenschutz-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

# Audio und Skripte haben einen Fingerabdruck im Namen und ändern sich nie:
# lange zwischenspeichern, damit sie beim zweiten Besuch sofort da sind.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Den Reiter "Dein Hoffnungsbild" gibt es nicht mehr (Hoffnungsbilder liegen in der Kirche aus).
# Alte Links und QR-Codes führen auf die Startseite der jeweiligen Kirche.
[[redirects]]
  from = "/michaelskirche/hoffnungsbild/*"
  to = "/michaelskirche/"
  status = 301
  force = true

[[redirects]]
  from = "/michaelskirche/hoffnungsbild"
  to = "/michaelskirche/"
  status = 301
  force = true

[[redirects]]
  from = "/pauluskirche/hoffnungsbild/*"
  to = "/pauluskirche/"
  status = 301
  force = true

[[redirects]]
  from = "/pauluskirche/hoffnungsbild"
  to = "/pauluskirche/"
  status = 301
  force = true
